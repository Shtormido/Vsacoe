name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests
        run: dotnet test tests/Vsacoe.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/Vsacoe/Vsacoe.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o artifacts/win-x64

      - name: Smoke test (launch on the runner desktop)
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Text;
          public static class W {
            public delegate bool P(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(P p, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetWindow(IntPtr h, uint c);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            public static string Cls(IntPtr h) { var s = new StringBuilder(256); GetClassName(h, s, 256); return s.ToString(); }
            public static string Txt(IntPtr h) { var s = new StringBuilder(256); GetWindowText(h, s, 256); return s.ToString(); }
          }
          "@
          $data = Join-Path $env:APPDATA 'Vsacoe'
          $p = Start-Process artifacts/win-x64/Vsacoe.exe -PassThru
          Start-Sleep -Seconds 20
          $log = Join-Path $data 'vsacoe.log'
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { throw "Vsacoe exited with code $($p.ExitCode)" }

          $fences = New-Object System.Collections.ArrayList
          [W]::EnumWindows({ param($h, $l)
            $procId = 0; [void][W]::GetWindowThreadProcessId($h, [ref]$procId)
            if ($procId -eq $p.Id) {
              $owner = [W]::GetWindow($h, 4)
              $info = "{0} '{1}' visible={2} owner={3}" -f [W]::Cls($h), [W]::Txt($h), [W]::IsWindowVisible($h), $(if ($owner -ne [IntPtr]::Zero) { [W]::Cls($owner) } else { '-' })
              Write-Host $info
              if ([W]::Txt($h) -eq 'Vsacoe Fence' -and [W]::IsWindowVisible($h)) { [void]$fences.Add($info) }
            }
            return $true }, [IntPtr]::Zero) | Out-Null

          Get-Content (Join-Path $data 'settings.json')
          Stop-Process -Id $p.Id
          if ($fences.Count -lt 1) { throw 'No visible fence window found' }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Unhandled|Fatal' -Quiet)) { throw 'Errors in log' }

      - uses: actions/upload-artifact@v4
        with:
          name: Vsacoe-win-x64
          path: artifacts/win-x64/Vsacoe.exe

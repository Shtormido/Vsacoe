name: Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_analyze.py tests/test_units.py
      - name: Build
        run: packaging\build_exe.bat
        shell: cmd
      - name: Smoke test
        run: dist\blockscan.exe services show Telegram
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: blockscan-windows
          path: dist/blockscan.exe

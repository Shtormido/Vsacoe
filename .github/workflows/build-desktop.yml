name: Сборка игры для ПК

on:
  push:
    branches: [main, master, 'ccr-*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: pushistyi-salon-windows
          path: release/*.exe
          if-no-files-found: error

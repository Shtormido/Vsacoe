<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Придорожный Мотель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="hud" class="hidden">
    <div class="hud-row">
      <span id="hud-day"></span>
      <span id="hud-time"></span>
      <span id="hud-money"></span>
      <span id="hud-rep"></span>
    </div>
    <div class="hud-row bars">
      <div class="bar" title="Выносливость"><i>⚡</i><b id="bar-stamina"></b></div>
      <div class="bar" title="Подозрения города"><i>👁</i><b id="bar-suspicion"></b></div>
      <div class="bar" title="Чистота мотеля"><i>🧽</i><b id="bar-clean"></b></div>
      <div class="bar" title="Совесть"><i>♥</i><b id="bar-conscience"></b></div>
    </div>
    <div id="hud-tray"></div>
  </div>

  <div id="stage">
    <canvas id="game" width="640" height="360"></canvas>
    <div id="prompt" class="hidden"></div>
  </div>

  <div id="toasts"></div>
  <div id="modal" class="hidden"><div id="modal-box"></div></div>

  <div id="touch">
    <div class="dpad">
      <button data-k="up">▲</button>
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
      <button data-k="down">▼</button>
    </div>
    <div class="acts">
      <button data-k="act">E</button>
      <button data-k="space">␣</button>
    </div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/gfx/core.js"></script>
<script src="js/gfx/chars.js"></script>
<script src="js/gfx/items.js"></script>
<script src="js/gfx/diner.js"></script>
<script src="js/gfx/motel.js"></script>
<script src="js/ui.js"></script>
<script src="js/kitchen.js"></script>
<script src="js/night.js"></script>
<script src="js/morning.js"></script>
<script src="js/staff.js"></script>
<script src="js/main.js"></script>
</body>
</html>

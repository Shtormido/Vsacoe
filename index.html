<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MP3UP — твоя музыка</title>
  <meta name="description" content="MP3UP — музыкальный плеер для вашей коллекции MP3: без подписок, рекламы и интернета.">
  <meta name="theme-color" content="#0b0b10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Иконки -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <symbol id="i-logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="url(#logoGrad)" stroke="none"/><path d="M25 20.5v23a1.5 1.5 0 0 0 2.3 1.3l18-11.5a1.5 1.5 0 0 0 0-2.6l-18-11.5A1.5 1.5 0 0 0 25 20.5z" fill="#fff" stroke="none"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></symbol>
  <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z" fill="currentColor"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.9l12-7.4a1 1 0 0 0 0-1.8l-12-7.4A1 1 0 0 0 7 4.6z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.5" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4.5" height="16" rx="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M4.5 5.2v13.6a.8.8 0 0 0 1.2.7l9.8-6.8a.8.8 0 0 0 0-1.4L5.7 4.5a.8.8 0 0 0-1.2.7z" fill="currentColor" stroke="none"/><rect x="17" y="4.5" width="2.6" height="15" rx="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19.5 5.2v13.6a.8.8 0 0 1-1.2.7L8.5 12.7a.8.8 0 0 1 0-1.4l9.8-6.8a.8.8 0 0 1 1.2.7z" fill="currentColor" stroke="none"/><rect x="4.4" y="4.5" width="2.6" height="15" rx="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-volume-low" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
  <symbol id="i-volume-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/><path d="M12 12H3M16 6H3M12 18H3"/></symbol>
  <symbol id="i-eq" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h2l3-7 4 14 4-10 3 6h4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-next-up" viewBox="0 0 24 24"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<div class="app" id="app">

  <!-- Боковая панель -->
  <aside class="sidebar">
    <a class="logo" href="#/home" aria-label="MP3UP — на главную">
      <svg class="logo-mark"><use href="#i-logo"/></svg>
      <span>MP3<b>UP</b></span>
    </a>

    <nav class="nav">
      <a href="#/home" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Главная</span></a>
      <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span>Поиск</span></a>
      <a href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span>Медиатека</span></a>
    </nav>

    <button class="wave-mini" data-play="wave">
      <span class="wave-mini-icon"><svg class="ic"><use href="#i-wave"/></svg></span>
      <span class="wave-mini-text"><b>Моя волна</b><small>Поток из вашей музыки</small></span>
    </button>

    <div class="side-section">
      <div class="side-head">
        <span>Плейлисты</span>
        <button class="icon-btn sm" data-act="new-playlist" title="Создать плейлист" aria-label="Создать плейлист"><svg class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <div class="side-list" id="sidebarPlaylists"></div>
    </div>

    <div class="side-foot" id="libStats"></div>
  </aside>

  <!-- Основная область -->
  <main class="main" id="main">
    <div class="main-glow"></div>
    <header class="topbar" id="topbar">
      <div class="nav-arrows">
        <button class="icon-btn round" data-act="back" aria-label="Назад"><svg class="ic"><use href="#i-chevron-left"/></svg></button>
        <button class="icon-btn round" data-act="forward" aria-label="Вперёд"><svg class="ic"><use href="#i-chevron-right"/></svg></button>
      </div>
      <a class="logo logo-mobile" href="#/home" aria-label="MP3UP"><svg class="logo-mark"><use href="#i-logo"/></svg><span>MP3<b>UP</b></span></a>
      <label class="top-search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="topSearch" type="search" placeholder="Трек, исполнитель или альбом" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <div class="top-actions">
        <button class="btn btn-primary" data-act="add-music" title="Добавить MP3 с устройства"><svg class="ic"><use href="#i-upload"/></svg><span>Добавить музыку</span></button>
        <button class="icon-btn round" data-act="theme" title="Сменить тему" aria-label="Сменить тему"><svg class="ic"><use href="#i-sun"/></svg></button>
        <button class="icon-btn round hide-sm" data-act="help" title="Подсказки и горячие клавиши" aria-label="Подсказки"><svg class="ic"><use href="#i-keyboard"/></svg></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <!-- Плеер -->
  <footer class="player" id="player">
    <div class="mini-progress"><div id="miniProg"></div></div>
    <div class="p-left">
      <button class="p-cover" data-ctl="np" aria-label="Открыть плеер" id="pCover"></button>
      <button class="p-info" data-ctl="np" aria-label="Открыть плеер">
        <span class="p-title" id="pTitle">Ничего не играет</span>
        <span class="p-artist" id="pArtist">Выберите трек, чтобы начать</span>
      </button>
      <button class="icon-btn like" data-ctl="like" aria-label="Нравится" title="Нравится (L)"><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>
    <div class="p-center">
      <div class="p-controls">
        <button class="icon-btn" data-ctl="shuffle" title="Перемешать (S)" aria-label="Перемешать"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" data-ctl="prev" title="Предыдущий (Shift + ←)" aria-label="Предыдущий"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="play-btn" data-ctl="play" title="Слушать / пауза (пробел)" aria-label="Слушать"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="icon-btn" data-ctl="next" title="Следующий (Shift + →)" aria-label="Следующий"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="icon-btn" data-ctl="repeat" title="Повтор (R)" aria-label="Повтор"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="p-progress">
        <span class="time t-cur">0:00</span>
        <input type="range" class="range seek" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
        <span class="time t-dur">0:00</span>
      </div>
    </div>
    <div class="p-right">
      <button class="icon-btn" data-ctl="eq" title="Эквалайзер (E)" aria-label="Эквалайзер"><svg class="ic"><use href="#i-eq"/></svg></button>
      <button class="icon-btn" data-ctl="queue" title="Очередь (Q)" aria-label="Очередь"><svg class="ic"><use href="#i-queue"/></svg></button>
      <div class="vol-wrap">
        <button class="icon-btn" data-ctl="mute" title="Без звука (M)" aria-label="Без звука"><svg class="ic"><use href="#i-volume"/></svg></button>
        <input type="range" class="range vol" min="0" max="100" value="80" aria-label="Громкость">
      </div>
      <button class="icon-btn" data-ctl="np" title="Полноэкранный плеер (F)" aria-label="Полноэкранный плеер"><svg class="ic"><use href="#i-expand"/></svg></button>
    </div>
  </footer>

  <!-- Нижнее меню (телефон) -->
  <nav class="bottom-nav">
    <a href="#/home" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Главная</span></a>
    <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span>Поиск</span></a>
    <a href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span>Медиатека</span></a>
    <a href="#/liked" data-nav="liked"><svg class="ic"><use href="#i-heart"/></svg><span>Любимое</span></a>
  </nav>
</div>

<!-- Очередь -->
<aside class="queue-panel" id="queuePanel" aria-label="Очередь воспроизведения">
  <header class="qp-head">
    <h3>Очередь</h3>
    <button class="icon-btn round" data-ctl="queue" aria-label="Закрыть очередь"><svg class="ic"><use href="#i-close"/></svg></button>
  </header>
  <div class="qp-body" id="queueBody"></div>
</aside>

<!-- Полноэкранный плеер -->
<div class="np" id="np" aria-hidden="true">
  <div class="np-bg" id="npBg"></div>
  <canvas class="np-viz" id="viz"></canvas>
  <div class="np-inner">
    <header class="np-top">
      <button class="icon-btn round" data-ctl="np" aria-label="Свернуть"><svg class="ic"><use href="#i-chevron-down"/></svg></button>
      <div class="np-ctx"><span>Играет из</span><b id="npCtx">—</b></div>
      <button class="icon-btn round" data-ctl="queue" aria-label="Очередь"><svg class="ic"><use href="#i-queue"/></svg></button>
    </header>
    <div class="np-main">
      <div class="np-cover" id="npCover"></div>
      <div class="np-panel">
        <div class="np-meta">
          <div class="np-text">
            <h2 id="npTitle">—</h2>
            <button class="np-artist" data-act="np-artist" id="npArtist">—</button>
          </div>
          <button class="icon-btn like lg" data-ctl="like" aria-label="Нравится"><svg class="ic"><use href="#i-heart"/></svg></button>
        </div>
        <div class="np-progress">
          <input type="range" class="range seek" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
          <div class="np-times"><span class="t-cur">0:00</span><span class="t-dur">0:00</span></div>
        </div>
        <div class="np-controls">
          <button class="icon-btn lg" data-ctl="shuffle" aria-label="Перемешать"><svg class="ic"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn xl" data-ctl="prev" aria-label="Предыдущий"><svg class="ic"><use href="#i-prev"/></svg></button>
          <button class="play-btn xl" data-ctl="play" aria-label="Слушать"><svg class="ic"><use href="#i-play"/></svg></button>
          <button class="icon-btn xl" data-ctl="next" aria-label="Следующий"><svg class="ic"><use href="#i-next"/></svg></button>
          <button class="icon-btn lg" data-ctl="repeat" aria-label="Повтор"><svg class="ic"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="np-bottom">
          <button class="chip" data-ctl="eq"><svg class="ic"><use href="#i-eq"/></svg>Эквалайзер</button>
          <div class="vol-wrap">
            <button class="icon-btn" data-ctl="mute" aria-label="Без звука"><svg class="ic"><use href="#i-volume"/></svg></button>
            <input type="range" class="range vol" min="0" max="100" value="80" aria-label="Громкость">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Перетаскивание файлов -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-box">
    <svg class="ic"><use href="#i-upload"/></svg>
    <b>Отпустите, чтобы добавить музыку</b>
    <span>MP3, M4A, FLAC, OGG, WAV — можно целыми папками</span>
  </div>
</div>

<div class="menu" id="menu" role="menu"></div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.oga,.opus,.wav,.webm" multiple hidden>
<input type="file" id="folderInput" webkitdirectory multiple hidden>
<audio id="audio" preload="auto"></audio>

<script src="js/db.js"></script>
<script src="js/tags.js"></script>
<script src="js/app.js"></script>
</body>
</html>

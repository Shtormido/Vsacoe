[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blockscan"
version = "0.1.0"
description = "Сканер блокировок провайдера (DNS, IP, SNI/DPI, HTTP, QUIC) и генератор hostlist для zapret"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
blockscan = "blockscan.cli:main"

[tool.setuptools.packages.find]
include = ["blockscan*"]

[tool.setuptools.package-data]
blockscan = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

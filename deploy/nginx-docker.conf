# «Придорожный Мотель» — статический сайт для nginx.
# install.sh подставляет 80, _ и /usr/share/nginx/html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # код и стили кэшируем ненадолго, шрифты и картинки — надолго
    location ~* \.(?:js|css)$ { expires 1h; }
    location ~* \.(?:woff2|png|ico)$ { expires 30d; }

    # скрытые файлы не отдаём
    location ~ /\.(?!well-known) { deny all; }

    gzip on;
    gzip_types text/css application/javascript text/plain;
    add_header X-Content-Type-Options nosniff always;
}

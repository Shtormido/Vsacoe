# «Придорожный Мотель» — статический сайт для nginx.
# install.sh подставляет 80, _ и /usr/share/nginx/html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # страница, код и стили — всегда проверять обновления (после обновления игра сразу новая)
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    location ~* \.(?:js|css)$ { expires -1; }
    # шрифты и картинки кэшируем надолго
    location ~* \.(?:woff2|png|ico)$ { expires 30d; }

    # скрытые файлы не отдаём
    location ~ /\.(?!well-known) { deny all; }

    gzip on;
    gzip_types text/css application/javascript text/plain;
    add_header X-Content-Type-Options nosniff always;
}

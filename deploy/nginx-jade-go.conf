# Нефритовое Го через nginx: статику отдаёт nginx, онлайн-партии (/api/) — server/serve.py.
# serve.py должен работать (sudo ./deploy/install.sh --host 127.0.0.1), иначе игра по сети будет недоступна.
#   sudo apt install nginx
#   sudo cp -r site /var/www/jade-go
#   sudo cp deploy/nginx-jade-go.conf /etc/nginx/sites-available/jade-go
#   sudo ln -s /etc/nginx/sites-available/jade-go /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS с бесплатным сертификатом: sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d ваш.домен

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # замените на свой домен

    root /var/www/jade-go;
    index index.html;
    autoindex off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        types { font/woff2 woff2; application/javascript js; text/css css; }
    }

    # online play: rooms and their event streams (Server-Sent Events must not be buffered)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location ~ /\. { deny all; }
}
